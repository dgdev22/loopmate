name: Build MSIX for Microsoft Store

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-msix:
    name: Build Windows MSIX
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for sync:version to read Git tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build MSIX for Microsoft Store
        run: npm run build:ms-store
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify AppX icons were included
        run: |
          Write-Host "Verifying AppX icons in build/appx/..."
          $icons = Get-ChildItem -Path "build/appx" -Filter "*.png" -File
          Write-Host "Found $($icons.Count) icon files in build/appx/:"
          foreach ($icon in $icons) {
            Write-Host "  - $($icon.Name) ($([math]::Round($icon.Length / 1024, 1)) KB)"
          }
          $critical = @("Square44x44Logo.png", "Square150x150Logo.png", "StoreLogo.png", "Wide310x150Logo.png")
          foreach ($name in $critical) {
            if (!(Test-Path "build/appx/$name")) {
              Write-Error "CRITICAL: Missing $name in build/appx/"
              exit 1
            }
          }
          Write-Host "All critical AppX icons are present!"
        shell: pwsh

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: msix-build
          path: |
            release/**/*-Store-*.appx
          retention-days: 90
          if-no-files-found: error

      - name: Create Release Asset (if tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/**/*-Store-*.appx
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
